# Secret scanning (gitleaks): the default rules, plus narrowly scoped false positives.
[extend]
useDefault = true

# SHA-256 hashes of vendored contract files (contracts.lock.json), not credentials.
[[allowlists]]
description = "contracts lock hashes"
paths = ['''^contracts\.lock\.json$''']

# Documentation placeholder in src/config/env.ts ("-----BEGIN PRIVATE KEY-----..."), not key material.
[[allowlists]]
description = "PEM placeholder in docs/comments"
regexTarget = "line"
regexes = ['-----BEGIN PRIVATE KEY-----\.\.\.']

# The common-password DENYLIST (passwords users may not choose).
[[allowlists]]
description = "common-password denylist"
paths = ['^src/security/password\.ts$']
